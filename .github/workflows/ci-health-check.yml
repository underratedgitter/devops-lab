name: Daily DevOps Lab Automation

on:
  schedule:
    # Runs daily so the randomizer evaluates every day at 08:00 AM IST (02:30 UTC)
    - cron: '30 2 * * *'
    # Backup retry window at 12:00 PM IST (06:30 UTC)
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-devops-lab-automation
  cancel-in-progress: false

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull Latest Changes Before Write
        run: |
          git config --local user.email "sp9023156004@gmail.com"
          git config --local user.name "Suraj Patel"
          git pull --rebase origin main

      - name: Resolve Daily Run State
        id: daily
        run: |
          TODAY=$(TZ="Asia/Kolkata" date +'%Y-%m-%d')
          echo "today=${TODAY}" >> "${GITHUB_OUTPUT}"

      - name: Evaluate 4-Day Random Weekly Schedule
        id: schedule-check
        run: |
          python3 -c "
          import hashlib, os, random, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              print('Manual trigger via workflow_dispatch: forcing run.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('should_commit=true\n')
              sys.exit(0)

          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          year, week_num, weekday = now.isocalendar()
          day_names = {1: 'Mon', 2: 'Tue', 3: 'Wed', 4: 'Thu', 5: 'Fri', 6: 'Sat', 7: 'Sun'}

          # Deterministic seed per ISO week ensures consistency across runs within the same week
          seed_int = int(hashlib.sha256(f'devops-lab-v2-{year}-W{week_num}'.encode()).hexdigest(), 16)
          rng = random.Random(seed_int)
          active_days = set(rng.sample(range(1, 8), 4))

          active_str = ', '.join([day_names[d] for d in sorted(active_days)])
          today_name = day_names[weekday]

          print(f'📅 ISO Week {year}-W{week_num:02d} randomized commit days: {active_str}')
          print(f'📅 Today is: {today_name} (day {weekday})')

          should_commit = (weekday in active_days)
          print(f'⚡ Should commit today? {should_commit}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'should_commit={\"true\" if should_commit else \"false\"}\n')
              f.write(f'active_days={active_str}\n')
              f.write(f'today_name={today_name}\n')
          "
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: Validate Python Syntax
        run: |
          python3 -m py_compile python/*.py docker/examples/python-app/*.py scripts/*.py

      - name: Validate Shell Scripts
        run: |
          bash -n scripts/*.sh

      - name: Validate YAML and JSON Syntax
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "
          import glob, json, sys, yaml

          for path in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              try:
                  with open(path, encoding='utf-8') as f:
                      yaml.safe_load(f)
                  print(f'OK: {path}')
              except Exception as exc:
                  print(f'ERROR in {path}: {exc}', file=sys.stderr)
                  sys.exit(1)

          for path in glob.glob('**/*.json', recursive=True):
              try:
                  with open(path, encoding='utf-8') as f:
                      json.load(f)
                  print(f'OK: {path}')
              except Exception as exc:
                  print(f'ERROR in {path}: {exc}', file=sys.stderr)
                  sys.exit(1)
          "

      - name: Generate Daily DevOps Note
        if: steps.schedule-check.outputs.should_commit == 'true'
        run: |
          python3 scripts/daily_updater.py

      - name: Commit & Push Daily Automation Updates
        if: steps.schedule-check.outputs.should_commit == 'true'
        run: |
          mkdir -p automation/logs
          git config --local user.email "sp9023156004@gmail.com"
          git config --local user.name "Suraj Patel"

          # Prevent duplicate commits on the same day if already committed
          if git log -5 --format='%s' | grep -q "\[${{ steps.daily.outputs.today }}\]"; then
            echo "Today's commit [${{ steps.daily.outputs.today }}] already exists in recent git history. Skipping duplicate commit."
            exit 0
          fi

          for BATCH in 1 2 3; do
            UTC_NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            IST_NOW=$(TZ="Asia/Kolkata" date '+%Y-%m-%d %H:%M:%S IST')

            echo "System health status: OK [$UTC_NOW]" > automation/logs/health-check.log
            echo "[$IST_NOW] Daily DevOps Lab automation batch ${BATCH}/3 completed for run ${GITHUB_RUN_ID}." >> automation/logs/system-activity.log

            git add daily/*.md
            git add -f automation/logs/health-check.log automation/logs/system-activity.log

            if git diff --staged --quiet; then
              echo "No daily automation changes detected for batch ${BATCH}. Skipping commit."
            else
              git commit -m "chore(ci): run daily devops lab automation batch ${BATCH} [${{ steps.daily.outputs.today }}]"

              git push origin main || (
                echo "Push failed, pulling and retrying..."
                git pull --rebase origin main &&
                git push origin main
              )
            fi
          done
