name: CI System Health & Metrics

on:
  schedule:
    # Multiple daily execution slots to ensure commit reliability even during GitHub queue delays
    - cron: '30 2 * * *'   # Primary: 08:00 AM IST (02:30 AM UTC)
    - cron: '30 6 * * *'   # Backup 1: 12:00 PM IST (06:30 AM UTC)
    - cron: '30 12 * * *'  # Backup 2: 06:00 PM IST (12:30 PM UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update System & Telemetry Logs
        run: |
          mkdir -p automation/logs
          UTC_NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IST_NOW=$(TZ="Asia/Kolkata" date '+%Y-%m-%d %H:%M:%S IST')
          
          # Overwrite current status file
          echo "System health status: OK [$UTC_NOW]" > automation/logs/health-check.log
          
          # Append to activity history log (guarantees non-empty git diff on every run)
          echo "[$IST_NOW] Automated telemetry update executed successfully." >> automation/logs/system-activity.log

      - name: Sync & Push Telemetry Updates
        run: |
          git config --local user.email "sp9023156004@gmail.com"
          git config --local user.name "Suraj Patel"
          
          # Force stage log files regardless of gitignore defaults
          git add -f automation/logs/health-check.log automation/logs/system-activity.log
          
          # Check if there are changes staged
          if git diff --staged --quiet; then
            echo "No telemetry changes detected. Skipping commit."
          else
            TODAY=$(TZ="Asia/Kolkata" date +'%Y-%m-%d')
            git commit -m "chore(ci): update system health check & telemetry [$TODAY]"
            
            # Pull latest changes with rebase to prevent push rejection
            git pull --rebase origin main || true
            
            # Robust push with retry logic
            git push origin main || (sleep 5 && git pull --rebase origin main && git push origin main)
          fi
