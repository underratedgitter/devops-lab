name: Daily DevOps Lab Automation

on:
  schedule:
    - cron: '30 2 * * *'   # Primary run: 08:00 AM IST
    - cron: '30 6 * * *'   # Retry window: 12:00 PM IST
    - cron: '30 12 * * *'  # Retry window: 06:00 PM IST
    - cron: '30 17 * * *'  # Retry window: 11:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-devops-lab-automation
  cancel-in-progress: false

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull Latest Changes Before Write
        run: |
          git config --local user.email "sp9023156004@gmail.com"
          git config --local user.name "Suraj Patel"
          git pull --rebase origin main

      - name: Resolve Daily Run State
        id: daily
        run: |
          TODAY=$(TZ="Asia/Kolkata" date +'%Y-%m-%d')
          echo "today=${TODAY}" >> "${GITHUB_OUTPUT}"

      - name: Validate Python Syntax
        run: |
          python3 -m py_compile python/*.py docker/examples/python-app/*.py scripts/*.py

      - name: Validate Shell Scripts
        run: |
          bash -n scripts/*.sh

      - name: Validate YAML and JSON Syntax
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "
          import glob, json, sys, yaml

          for path in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              try:
                  with open(path, encoding='utf-8') as f:
                      yaml.safe_load(f)
                  print(f'OK: {path}')
              except Exception as exc:
                  print(f'ERROR in {path}: {exc}', file=sys.stderr)
                  sys.exit(1)

          for path in glob.glob('**/*.json', recursive=True):
              try:
                  with open(path, encoding='utf-8') as f:
                      json.load(f)
                  print(f'OK: {path}')
              except Exception as exc:
                  print(f'ERROR in {path}: {exc}', file=sys.stderr)
                  sys.exit(1)
          "

      - name: Generate Daily DevOps Note
        run: |
          python3 scripts/daily_updater.py

      - name: Commit & Push Daily Automation Updates
        run: |
          mkdir -p automation/logs
          git config --local user.email "sp9023156004@gmail.com"
          git config --local user.name "Suraj Patel"

          for BATCH in 1 2 3; do
            UTC_NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            IST_NOW=$(TZ="Asia/Kolkata" date '+%Y-%m-%d %H:%M:%S IST')

            echo "System health status: OK [$UTC_NOW]" > automation/logs/health-check.log
            echo "[$IST_NOW] Daily DevOps Lab automation batch ${BATCH}/3 completed for run ${GITHUB_RUN_ID}." >> automation/logs/system-activity.log

            git add daily/*.md
            git add -f automation/logs/health-check.log automation/logs/system-activity.log

            if git diff --staged --quiet; then
              echo "No daily automation changes detected for batch ${BATCH}. Skipping commit."
            else
              git commit -m "chore(ci): run daily devops lab automation batch ${BATCH} [${{ steps.daily.outputs.today }}]"

              git push origin main || (
                echo "Push failed, pulling and retrying..."
                git pull --rebase origin main &&
                git push origin main
              )
            fi
          done
