name: Daily Auto Commit

on:
  schedule:
    - cron: '30 2 * * *'  # Runs every day at 08:00 AM IST (02:30 AM UTC)
  workflow_dispatch:      # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Daily Activity Log
        run: |
          mkdir -p daily
          echo "Daily commit: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> daily/activity.log

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily/activity.log
          git commit -m "chore(daily): automated daily activity update [$(date +'%Y-%m-%d')]" || exit 0
          git push
