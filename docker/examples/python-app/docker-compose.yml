# Docker Compose — Example Python App
#
# Demonstrates:
#   - Multi-container application (app + Redis + PostgreSQL)
#   - Named volumes for data persistence
#   - Custom bridge network for container DNS
#   - Health checks for all services
#   - Environment variable configuration
#   - Dependency ordering with health conditions
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose ps             # Check status
#   docker compose logs -f app    # Follow app logs
#   docker compose down           # Stop and remove containers
#   docker compose down -v        # Stop and remove containers + volumes

services:
  # ---------- Application ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-lab-app
    ports:
      - "5000:5000"
    environment:
      - APP_NAME=devops-lab-example
      - APP_VERSION=1.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FLASK_ENV=development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ---------- Redis (Cache / Counter) ----------
  redis:
    image: redis:7-alpine
    container_name: devops-lab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    restart: unless-stopped

  # ---------- PostgreSQL (Database) ----------
  postgres:
    image: postgres:16-alpine
    container_name: devops-lab-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: devops_lab
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme  # Use secrets in production!
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d devops_lab"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

# ---------- Volumes ----------
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local

# ---------- Networks ----------
networks:
  app-network:
    driver: bridge
